<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0e9f94">
<title>Mi Tracker · hábitos, horario y estudio</title>
<style>
:root{--bg:#f4f6f8;--card:#fff;--text:#1d2433;--muted:#667085;--line:#e1e5eb;--accent:#0e9f94;--accent2:#6d3fc4;
--good:#0f5132;--goodbg:#c6efce;--mid:#7f4f00;--midbg:#ffeb9c;--bad:#9c0006;--badbg:#ffc7ce;--rest:#1f4e79;--restbg:#ddebf7;--na:#667085;--nabg:#e7e6e6;--shadow:0 1px 3px rgba(16,24,40,.08)}
@media (prefers-color-scheme:dark){:root{--bg:#10141c;--card:#1a2030;--text:#e8ecf3;--muted:#98a2b3;--line:#2b3347;--shadow:none}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
header{position:sticky;top:0;z-index:20;background:var(--card);border-bottom:1px solid var(--line);box-shadow:var(--shadow)}
.top{display:flex;align-items:center;gap:12px;padding:10px 16px;max-width:1180px;margin:0 auto}
.logo{font-weight:800;font-size:18px;letter-spacing:-.3px}
.logo b{color:var(--accent)}
nav{display:flex;gap:4px;overflow-x:auto;padding:0 12px 8px;max-width:1180px;margin:0 auto}
nav button{border:0;background:transparent;color:var(--muted);padding:8px 14px;border-radius:999px;font:inherit;font-weight:600;cursor:pointer;white-space:nowrap}
nav button.on{background:var(--accent);color:#fff}
nav button:hover:not(.on){background:var(--line)}
main{max-width:1180px;margin:0 auto;padding:16px}
h2{margin:0 0 12px;font-size:20px}
h3{margin:0 0 8px;font-size:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;box-shadow:var(--shadow);margin-bottom:14px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.spread{justify-content:space-between}
.muted{color:var(--muted)}
.small{font-size:12px}
.btn{border:1px solid var(--line);background:var(--card);color:var(--text);padding:7px 12px;border-radius:10px;font:inherit;font-weight:600;cursor:pointer}
.btn:hover{filter:brightness(.96)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.dan{color:var(--bad);border-color:var(--badbg)}
.btn.sm{padding:3px 9px;font-size:12px;border-radius:8px}
input,select,textarea{font:inherit;color:var(--text);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 8px;max-width:100%}
input[type=number]{width:84px}
input[type=color]{padding:0;width:40px;height:30px}
label.f{display:block;margin:8px 0}
label.f span{display:block;font-size:12px;font-weight:700;color:var(--muted);margin-bottom:2px}
label.f input,label.f select,label.f textarea{width:100%}
.kpi{border-radius:14px;padding:12px 14px;background:var(--card);border:1px solid var(--line)}
.kpi .v{font-size:26px;font-weight:800;line-height:1.1}
.kpi .l{font-size:12px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.3px}
.kpi.good{background:var(--goodbg);color:#0f3d24}.kpi.mid{background:var(--midbg);color:#5c3b00}.kpi.bad{background:var(--badbg);color:#7a0004}
.kpi.good .l,.kpi.mid .l,.kpi.bad .l{color:inherit;opacity:.8}
.pill{display:inline-block;padding:1px 9px;border-radius:999px;font-size:12px;font-weight:700}
.good{background:var(--goodbg);color:var(--good)}.mid{background:var(--midbg);color:var(--mid)}.bad{background:var(--badbg);color:var(--bad)}.rest{background:var(--restbg);color:var(--rest)}.na{background:var(--nabg);color:var(--na)}
.cat{border-left:6px solid var(--accent);padding-left:12px}
.cat h3{display:flex;align-items:center;gap:8px}
.item{display:flex;align-items:center;gap:8px;padding:6px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.item:first-of-type{border-top:0}
.item .name{flex:1 1 180px;min-width:150px;font-weight:600}
.item .tgt{font-size:12px;color:var(--muted);font-weight:400}
.item.off{opacity:.45}
.seg{display:inline-flex;gap:3px;flex-wrap:wrap}
.seg button{border:1px solid var(--line);background:var(--card);color:var(--muted);border-radius:8px;padding:4px 10px;font:inherit;font-size:13px;font-weight:700;cursor:pointer}
.seg button.on.yes{background:var(--goodbg);color:var(--good);border-color:var(--goodbg)}
.seg button.on.no{background:var(--badbg);color:var(--bad);border-color:var(--badbg)}
.seg button.on.rest{background:var(--restbg);color:var(--rest);border-color:var(--restbg)}
.seg button.on.na{background:var(--nabg);color:var(--na);border-color:var(--nabg)}
.fld.good input{background:var(--goodbg);color:var(--good);border-color:var(--goodbg)}
.fld.mid input{background:var(--midbg);color:var(--mid);border-color:var(--midbg)}
.fld.bad input{background:var(--badbg);color:var(--bad);border-color:var(--badbg)}
table{width:100%;border-collapse:collapse}
th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
th{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.3px}
.bars .b{display:grid;grid-template-columns:minmax(90px,170px) 1fr 70px;gap:8px;align-items:center;margin:5px 0;font-size:13px}
.bars .t{background:var(--line);border-radius:6px;height:14px;overflow:hidden;position:relative}
.bars .t i{display:block;height:100%;border-radius:6px}
.bars .t u{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--text);opacity:.55}
.cols{display:flex;align-items:flex-end;gap:5px;height:150px;padding-top:8px}
.cols .c{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;min-width:0}
.cols .c i{display:block;width:100%;border-radius:5px 5px 0 0;min-height:2px}
.cols .c span{font-size:10px;color:var(--muted);margin-top:3px;white-space:nowrap}
.cols .c em{font-size:10px;font-style:normal;font-weight:700}
.chip{display:inline-block;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:700;color:#1b1b1b}
.tt{position:relative;display:grid;grid-template-columns:44px repeat(7,minmax(110px,1fr));min-width:860px}
.tt .hd{position:sticky;top:0;text-align:center;font-weight:700;font-size:13px;padding:6px 2px;border-bottom:1px solid var(--line);background:var(--card)}
.tt .hd.today{color:var(--accent)}
.tt .ax{position:relative;font-size:11px;color:var(--muted)}
.tt .ax div{position:absolute;right:4px;transform:translateY(-50%)}
.tt .day{position:relative;border-left:1px solid var(--line);cursor:cell;background-image:linear-gradient(var(--line) 1px,transparent 1px);background-size:100% 48px}
.tt .day.today{background-color:rgba(14,159,148,.06)}
.blk{position:absolute;border-radius:8px;padding:3px 5px;font-size:11.5px;line-height:1.25;overflow:hidden;color:#1b1b1b;cursor:pointer;border:1px solid rgba(0,0,0,.18);box-shadow:0 1px 2px rgba(0,0,0,.15)}
.blk b{display:block;font-size:12px}
.blk.clash{outline:2px solid #c0392b}
.scroll{overflow-x:auto}
dialog{border:0;border-radius:16px;padding:0;max-width:560px;width:calc(100% - 24px);background:var(--card);color:var(--text);box-shadow:0 20px 60px rgba(0,0,0,.35)}
dialog::backdrop{background:rgba(10,15,25,.55)}
dialog form{padding:18px;max-height:85vh;overflow:auto}
.days{display:flex;gap:4px;flex-wrap:wrap}
.days label{border:1px solid var(--line);border-radius:8px;padding:3px 9px;cursor:pointer;font-weight:700;font-size:13px}
.days input{display:none}.days input:checked+span{color:var(--accent)}
.days label:has(input:checked){background:var(--accent);color:#fff;border-color:var(--accent)}
.banner{background:var(--midbg);color:var(--mid);border-radius:12px;padding:10px 14px;margin-bottom:14px;font-weight:600}
.sw{display:flex;flex-wrap:wrap;gap:6px}.sw button{width:26px;height:26px;border-radius:8px;border:2px solid transparent;cursor:pointer}.sw button.on{border-color:var(--text)}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#1d2433;color:#fff;padding:9px 16px;border-radius:12px;z-index:60;font-weight:600}
@media (max-width:640px){main{padding:10px}.bars .b{grid-template-columns:90px 1fr 56px}}
@media print{header,.btn,nav{display:none}.card{break-inside:avoid}}
</style>
</head>
<body>
<header><div class="top"><div class="logo">Mi <b>Tracker</b></div><div class="muted small" id="sub"></div></div><nav id="nav"></nav></header>
<main id="app"></main>
<script>
'use strict';
/* =====================================================================
   MI TRACKER — todo editable. Los datos viven en tu navegador (localStorage).
   Haz copias de seguridad desde la pestaña «Datos».
   ===================================================================== */
const PALETTE=[['Turquesa','#0e9f94','#cff1ed'],['Morado','#6d3fc4','#e4daf6'],['Azul','#2f6fde','#dce8fb'],['Naranja','#d9731a','#fce5cc'],['Rosa','#d6336c','#fadce8'],['Verde','#2e9e4f','#d8f0df'],['Amarillo','#b58900','#fff3c4'],['Rojo','#c0392b','#f6d5d1'],['Marrón','#8d6e63','#e9dfda'],['Índigo','#3f51b5','#dadef3'],['Gris azulado','#546e7a','#dde5e9'],['Lima','#6b9a1e','#e6f2d3']];
const DAYN=['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'], DAYF=['Lunes','Martes','Miércoles','Jueves','Viernes','Sábado','Domingo'];
const MONN=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
const KEY='mi-tracker-v1';
let S=null; const UI={tab:'hoy',date:null,week:null,dash:{period:'all',cat:'',from:'',to:''},taskFilter:'pend'};

/* ---------- utilidades de fecha ---------- */
const pad=n=>String(n).padStart(2,'0');
const pd=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const fd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const addD=(s,n)=>{const d=pd(s);d.setDate(d.getDate()+n);return fd(d)};
const wd=s=>{const g=pd(s).getDay();return g===0?7:g};
const monday=s=>addD(s,-(wd(s)-1));
const realToday=()=>fd(new Date());
const today=()=>S&&S.settings.todayOverride||realToday();
const dim=(y,m)=>new Date(y,m,0).getDate();
const fmtD=s=>{if(!s)return'';const [y,m,d]=s.split('-');return d+'/'+m+'/'+y};
const fmtDS=s=>{if(!s)return'';const [y,m,d]=s.split('-');return d+'/'+m};
function range(a,b){const r=[];for(let d=a;d<=b;d=addD(d,1))r.push(d);return r}
const tmin=v=>{if(typeof v!=='string')return null;const m=/^(\d{1,2}):(\d{2})$/.exec(v);return m?(+m[1])*60+(+m[2]):null};
const mtxt=m=>pad(Math.floor(m/60))+':'+pad(m%60);
const rnd=x=>Math.round(x*1e9)/1e9;
const num=v=>typeof v==='number'&&isFinite(v);
const hrs=x=>(Math.round(x*100)/100).toString().replace('.',',');
const pct=x=>Math.round(x*100)+' %';
const uid=p=>p+Math.random().toString(36).slice(2,8);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---------- datos de ejemplo ---------- */
function seed(){
  const cats=[['Hábitos',0],['Planificación',2],['Rutina de mañana',3],['Rutina de noche',9],['Salud',5],['Sueño',10],['Medicación',4],['Práctica musical',1]].map((c,i)=>({id:'c'+(i+1),name:c[0],color:c[1]}));
  const C=n=>cats.find(c=>c.name===n).id;
  const hb=[];
  const add=(name,cat,type,o={})=>hb.push(Object.assign({id:'h'+(hb.length+1),name,cat:C(cat),type,mode:'daily',sense:'min',nature:'habit',unit:'',od:null,ow:null,om:null,freq:null,from:'',to:'',noct:false,days:[],active:true,role:'',study:false},o));
  add('Planificar el día','Planificación','yn');
  add('Revisión semanal','Planificación','yn',{mode:'freqWeek',freq:1});
  ['Gotas ojos (mañana)','Gel de la cara','Limpiador 1','Limpiador 2','Crema de pies','Crema de cara (mañana)','Crema de manos','Limar uñas'].forEach(n=>add(n,'Rutina de mañana','yn'));
  add('Cortar uñas (domingos)','Rutina de mañana','yn',{mode:'freqWeek',freq:1,days:[7]});
  add('Bálsamo (mañana)','Rutina de mañana','yn'); add('Lavarme los dientes (mañana)','Rutina de mañana','yn');
  ['Limpiar la cara (noche)','Crema (noche)','Bálsamo (noche)','Gotas ojos (noche)','Lavarme los dientes (noche)'].forEach(n=>add(n,'Rutina de noche','yn'));
  add('Hice caca','Salud','yn',{nature:'opt'});
  add('Agua','Salud','qty',{nature:'quant',unit:'L',od:2});
  add('Ejercicio','Salud','qty',{nature:'quant',unit:'min',mode:'freqWeek',od:30,freq:4});
  add('Lectura','Hábitos','qty',{nature:'quant',unit:'min',od:20});
  add('Saxo','Práctica musical','qty',{nature:'quant',unit:'min',mode:'freqWeek',od:60,freq:5});
  add('Piano','Práctica musical','qty',{nature:'quant',unit:'min',mode:'freqWeek',od:30,freq:4});
  add('Canto','Práctica musical','qty',{nature:'quant',unit:'min',mode:'freqWeek',od:20,freq:3});
  add('Técnica','Práctica musical','qty',{nature:'quant',unit:'min',mode:'freqWeek',od:20,freq:5});
  add('Lectura a vista','Práctica musical','qty',{nature:'quant',unit:'min',mode:'freqWeek',od:15,freq:4});
  add('Ensayo','Práctica musical','qty',{nature:'quant',unit:'min',mode:'totalWeek',ow:120});
  add('Hora de acostarse','Sueño','time',{sense:'max',from:'23:30',noct:true,role:'bed'});
  add('Hora de despertar','Sueño','time',{sense:'max',from:'07:30',role:'wake'});
  add('Concerta','Medicación','time',{sense:'between',from:'07:00',to:'09:30',role:'med'});
  add('Magnesio','Medicación','time',{sense:'between',from:'21:00',to:'23:00',role:'med'});
  const centers=[{id:'k1',name:'Conservatorio',color:6},{id:'k2',name:'Universidad',color:11},{id:'k3',name:'Curso de Administración',color:8},{id:'k4',name:'Otros',color:7}];
  const cons1=['Teoría de la educación I','Teoría y ritmo I','Coro Galego I','Técnica vocal I','Pedagogía musical','Didáctica del Lenguaje Musical I','Sociología de la Educación','Acústica general','Música de cámara','Conxunto I','Dirección I','Coro I','Piano Aplicado I','Improvisación y acompañamiento I','Coreografía y Danza I'];
  const sj=[];
  const sadd=(name,center,term,o={})=>sj.push(Object.assign({id:'s'+(sj.length+1),name,center,term,start:'',end:'',active:true,wk:null},o));
  cons1.forEach(n=>sadd(n,'k1','1'));
  [1,2,3].forEach(i=>sadd('Universidad - Asignatura '+i,'k2','all'));
  sadd('Curso de Administración','k3','custom',{start:'2026-10-15'});
  for(let i=1;i<=3;i++)sadd('2º cuatr. - Conservatorio '+i,'k1','2');
  const S1=n=>sj.find(s=>s.name===n).id;
  const cl=[];
  const c=(day,a,b,n,room,teacher)=>cl.push({id:'l'+(cl.length+1),day,start:a,end:b,subject:S1(n),room,teacher,notes:''});
  c(1,'12:00','14:00','Teoría de la educación I','Aula 3.06','Janet Salinas');c(1,'14:00','15:00','Teoría y ritmo I','Aula 3.06','Janet Salinas');
  c(1,'16:00','18:00','Coro Galego I','Orquesta','Nuria Lorenzo');c(1,'18:00','19:00','Técnica vocal I','Aula 1.03','Nuria Lorenzo');
  c(1,'19:00','21:30','Pedagogía musical','Aula 3.06','Adriana García');
  c(2,'10:00','12:00','Didáctica del Lenguaje Musical I','Aula 3.06','Adriana García');
  c(3,'10:00','12:00','Didáctica del Lenguaje Musical I','Aula 3.06','Adriana García');c(3,'13:30','15:30','Sociología de la Educación','Aula 3.06','Janet Salinas');
  c(3,'15:00','16:00','Acústica general','Electroacústica','¿?');c(3,'17:00','18:30','Música de cámara','Aula 1.06','Pablo Coello');
  c(4,'10:00','11:30','Conxunto I','Aula 3.06','Adriana García');c(4,'11:30','13:30','Pedagogía musical','Aula 3.06','Adriana García');
  c(4,'12:00','13:30','Dirección I','Aula 2.00','Fernando Briones');c(4,'13:30','15:00','Coro I','Orquesta','Fernando Briones');
  c(4,'15:00','16:00','Piano Aplicado I','Aula 3.03','Katerina');c(4,'16:00','17:00','Improvisación y acompañamiento I','Aula 3.03','Katerina');
  c(5,'10:00','12:00','Coreografía y Danza I','Orquesta','Janet Salinas');
  return {v:1,settings:{start:'2026-10-14',red:.5,green:.9,minData:3,sleepGreen:7,sleepRed:6,t1s:'2026-09-01',t1e:'2027-01-31',t2s:'2027-02-01',t2e:'2027-06-30',lastExport:'',todayOverride:'',incArch:true},
    cats,habits:hb,centers,subjects:sj,classes:cl,tasks:[],logs:{}};
}
function load(){try{const r=localStorage.getItem(KEY);if(r){const d=JSON.parse(r);if(d&&d.v===1){S=d;return}}}catch(e){}S=seed();save()}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast('No se pudo guardar: almacenamiento lleno o bloqueado')}}

/* =====================================================================
   NÚCLEO DE CÁLCULO (mismas reglas que el Excel)
   ===================================================================== */
const catOf=id=>S.cats.find(c=>c.id===id);
const hab=id=>S.habits.find(h=>h.id===id);
const subj=id=>S.subjects.find(s=>s.id===id);
const center=id=>S.centers.find(c=>c.id===id)||{name:'—',color:10};
const colOf=i=>PALETTE[((i%12)+12)%12];
function applies(h,date){return !h.days||!h.days.length||h.days.includes(wd(date))}
function dayState(date){return (S.logs[date]||{})._s||''}
function raw(id,date){const v=(S.logs[date]||{})[id];return v===undefined?null:v}
const adj=(m,noct)=>noct&&m<720?m+1440:m;
/* 1 cumple, 0 no cumple, '-' no cuenta (descanso/no aplica/antes del inicio), null sin registrar */
function score(h,date){
  if(date<S.settings.start)return '-';
  if(!applies(h,date))return '-';
  if(dayState(date))return '-';
  const v=raw(h.id,date);
  if(v===null||v==='')return null;
  if(v==='rest'||v==='na')return '-';
  if(h.type==='yn')return v==='yes'?1:v==='no'?0:null;
  if(h.type==='qty'){
    if(!num(v)||h.mode==='totalWeek'||h.mode==='totalMonth'||!num(h.od))return null;
    return h.sense==='max'?(rnd(v)<=rnd(h.od)?1:0):(rnd(v)>=rnd(h.od*S.settings.green)?1:0);
  }
  if(h.type==='time'){
    if(v==='no')return 0;
    const m=tmin(v),a=tmin(h.from),b=tmin(h.to);if(m==null||a==null)return null;
    const x=adj(m,h.noct),A=adj(a,h.noct),B=b==null?A:adj(b,h.noct);
    if(h.sense==='between')return x>=A&&x<=B?1:0;
    return h.sense==='max'?(x<=A?1:0):(x>=A?1:0);
  }
  return null;
}
function rawNum(h,date){if(date<S.settings.start)return null;const v=raw(h.id,date);return num(v)?v:null}
const isWeekMode=h=>h.mode==='freqWeek'||h.mode==='totalWeek';
function weeksIn(from,to){const r=[];for(let m=addD(monday(from),-7);m<=addD(to,7);m=addD(m,7)){const ref=addD(m,3);if(ref>=from&&ref<=to)r.push({start:m,end:addD(m,6),len:7})}return r}
function monthsIn(from,to){const r=[];let y=pd(from).getFullYear(),mo=pd(from).getMonth()+1;
  for(;;){const s=y+'-'+pad(mo)+'-01',e=y+'-'+pad(mo)+'-'+pad(dim(y,mo));if(s>to)break;if(e>=from)r.push({start:s,end:e,len:dim(y,mo)});mo++;if(mo>12){mo=1;y++}}return r}
/* devuelve {met,ev} del hábito en [from,to] (sin contar días futuros) */
function evalHabit(h,from,to){
  const t=today();let met=0,ev=0;
  if(h.mode==='daily'){for(const d of range(from,to)){if(d>t)break;const s=score(h,d);if(s===1){met++;ev++}else if(s===0)ev++}return{met,ev}}
  const units=isWeekMode(h)?weeksIn(from,to):monthsIn(from,to);
  const freqMode=h.mode==='freqWeek'||h.mode==='freqMonth';
  for(const u of units){
    const days=range(u.start,u.end);let ex=0,rec=0,md=0,cnt=0,sm=0;
    for(const d of days){const s=score(h,d);if(s==='-')ex++;else if(s===1){rec++;md++}else if(s===0)rec++;const n=rawNum(h,d);if(n!=null){cnt++;sm+=n}}
    const avail=u.len-ex,ended=u.end<=t;

function mv(arr,i){return h('span',{},h('button',{class:'btn sm',disabled:i===0,onclick:()=>{[arr[i-1],arr[i]]=[arr[i],arr[i-1]];save();render()}},'↑'),' ',h('button',{class:'btn sm',disabled:i===arr.length-1,onclick:()=>{[arr[i+1],arr[i]]=[arr[i],arr[i+1]];save();render()}},'↓'),' ')}
function editCat(c){const isNew=!c.id;form(isNew?'Nueva categoría':'Editar categoría',[{k:'name',label:'Nombre'},{k:'color',label:'Color',t:'color'}],c,v=>{if(!String(v.name||'').trim())return'Escribe un nombre';
  if(isNew)S.cats.push({id:uid('c'),name:v.name,color:v.color});else Object.assign(S.cats.find(x=>x.id===c.id),{name:v.name,color:v.color});save();render()},
  isNew?null:()=>{if(S.habits.some(x=>x.cat===c.id)){toast('Mueve o elimina antes sus hábitos');return}S.cats=S.cats.filter(x=>x.id!==c.id);save();render()})}
function editCenter(c){const isNew=!c.id;form(isNew?'Nuevo centro':'Editar centro',[{k:'name',label:'Nombre'},{k:'color',label:'Color',t:'color'}],c,v=>{if(!String(v.name||'').trim())return'Escribe un nombre';
  if(isNew)S.centers.push({id:uid('k'),name:v.name,color:v.color});else Object.assign(S.centers.find(x=>x.id===c.id),{name:v.name,color:v.color});save();render()},
  isNew?null:()=>{if(S.subjects.some(x=>x.center===c.id)){toast('Mueve o elimina antes sus asignaturas');return}S.centers=S.centers.filter(x=>x.id!==c.id);save();render()})}
function editHabit(x){
  const isNew=!x.id,Y=v=>v.type==='yn',Q=v=>v.type==='qty',T=v=>v.type==='time';
  form(isNew?'Nuevo hábito':'Editar hábito',[
    {k:'name',label:'Nombre'},{k:'cat',label:'Categoría',t:'select',opts:S.cats.map(c=>[c.id,c.name])},
    {k:'type',label:'Tipo de dato',t:'select',opts:[['yn','Sí / No'],['qty','Cantidad (minutos, litros…)'],['time','Hora (medicación, acostarse…)']]},
    {k:'nature',label:'Naturaleza',t:'select',opts:[['habit','Hábito (cuenta en el cumplimiento)'],['quant','Objetivo cuantificable (cuenta)'],['opt','Opcional (no penaliza)'],['ind','Indicador (solo registro)']]},
    {k:'unit',label:'Unidad',show:Q},
    {k:'mode',label:'Cómo se evalúa',t:'select',opts:[['daily','Cada día'],['freqWeek','Frecuencia semanal (N días por semana)'],['freqMonth','Frecuencia mensual (N días al mes)'],['totalWeek','Total semanal (suma)'],['totalMonth','Total mensual (suma)']],show:v=>!T(v)},
    {k:'sense',label:'Sentido',t:'select',opts:[['min','Al menos / después de'],['max','Como máximo / antes de']],show:Q},
    {k:'sense',label:'Sentido',t:'select',opts:[['min','Después de'],['max','Antes de'],['between','Entre dos horas']],show:T},
    {k:'od',label:'Objetivo diario',t:'number',show:v=>Q(v)&&(v.mode==='daily'||v.mode==='freqWeek'||v.mode==='freqMonth')},
    {k:'ow',label:'Objetivo semanal (total)',t:'number',show:v=>Q(v)&&v.mode==='totalWeek'},{k:'om',label:'Objetivo mensual (total)',t:'number',show:v=>Q(v)&&v.mode==='totalMonth'},
    {k:'freq',label:'Nº de días (por semana o mes)',t:'number',show:v=>!T(v)&&(v.mode==='freqWeek'||v.mode==='freqMonth')},
    {k:'from',label:'Hora (desde / límite)',t:'time',show:T},{k:'to',label:'Hasta',t:'time',show:v=>T(v)&&v.sense==='between'},
    {k:'noct',label:'Hora nocturna (cruza la medianoche, p. ej. acostarse)',t:'check',show:T},
    {k:'role',label:'Función especial',t:'select',opts:[['','Ninguna'],['bed','Hora de acostarse (para calcular el sueño)'],['wake','Hora de despertar (para calcular el sueño)'],['med','Medicación (tarjeta «en franja»)']],show:T},
    {k:'days',label:'Días en que aplica (vacío = todos)',t:'days'},{k:'active',label:'Activo (desmarca para archivarlo sin perder su historial)',t:'check'}],
    x,v=>{if(!String(v.name||'').trim())return'Escribe un nombre';if(!v.cat)return'Crea antes una categoría';
      if(v.type==='time'&&tmin(v.from)==null)return'Pon la hora';if(v.type==='time'&&v.sense==='between'&&tmin(v.to)==null)return'Pon la hora «hasta»';
      if((v.mode==='freqWeek'||v.mode==='freqMonth')&&!num(v.freq))return'Indica cuántos días';
      if(v.type!=='qty'&&(v.mode==='totalWeek'||v.mode==='totalMonth'))v.mode='daily';
      if(isNew)S.habits.push(Object.assign({id:uid('h')},v));else Object.assign(S.habits.find(q=>q.id===x.id),v);save();render()},
    isNew?null:()=>{S.habits=S.habits.filter(q=>q.id!==x.id);for(const d in S.logs){delete S.logs[d][x.id];if(!Object.keys(S.logs[d]).length)delete S.logs[d]}save();render()});
}

/* ---------- DATOS ---------- */
function download(name,text,type){const a=h('a',{href:URL.createObjectURL(new Blob([text],{type})),download:name});document.body.append(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500)}
function vDatos(app){
  const size=Math.round(JSON.stringify(S).length/1024);
  app.append(h('div',{class:'card'},h('h2',{},'Tus datos'),h('p',{},'Todo se guarda automáticamente en este navegador (≈'+size+' KB, '+Object.keys(S.logs).length+' días con datos). Si borras los datos del navegador o cambias de dispositivo se pierden: ',h('b',{},'haz copias de seguridad.')),
    h('p',{class:'muted small'},'Última copia: '+(S.settings.lastExport?fmtD(S.settings.lastExport):'nunca')),
    h('div',{class:'row'},
      h('button',{class:'btn pri',onclick:()=>{S.settings.lastExport=realToday();save();download('mi-tracker-'+realToday()+'.json',JSON.stringify(S,null,1),'application/json');render()}},'⬇ Exportar copia (JSON)'),
      h('label',{class:'btn'},'⬆ Importar copia',h('input',{type:'file',accept:'application/json,.json',style:'display:none',onchange:e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d||d.v!==1||!d.habits||!d.settings)throw 0;if(!confirm('Esto reemplaza todos los datos actuales por los de la copia. ¿Continuar?'))return;S=d;save();toast('Copia importada');render()}catch(_){toast('El archivo no es una copia válida')}};r.readAsText(f)}})),
      h('button',{class:'btn',onclick:()=>{const rows=[['fecha','habito','valor']];Object.keys(S.logs).sort().forEach(d=>{for(const k in S.logs[d]){const it=hab(k)||subj(k);rows.push([d,k==='_s'?'(estado del día)':it?it.name:k,S.logs[d][k]])}});download('registro.csv',rows.map(r=>r.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(',')).join('\n'),'text/csv')}},'Exportar registro (CSV)'),
      h('button',{class:'btn',onclick:()=>window.print()},'Imprimir'))));
  app.append(h('div',{class:'card'},h('h3',{},'Zona de peligro'),h('div',{class:'row'},
    h('button',{class:'btn dan',onclick:()=>{if(confirm('Se borrarán SOLO los registros diarios (hábitos, horas, estados). Se mantienen hábitos, horario y tareas. ¿Seguro?')){S.logs={};save();render()}}},'Borrar solo los registros diarios'),
    h('button',{class:'btn dan',onclick:()=>{if(confirm('Se borra TODO y se vuelve a los datos de ejemplo. ¿Seguro?')){S=seed();save();UI.date=null;UI.week=null;render()}}},'Restaurar datos de ejemplo'))));
  app.append(h('div',{class:'card'},h('h3',{},'Cómo funciona'),h('ul',{class:'small'},
    h('li',{},'Vacío = sin registrar: no cuenta ni como éxito ni como fallo. Descanso y N/A tampoco cuentan. Los días futuros y los anteriores al inicio no cuentan.'),
    h('li',{},'Cantidad: se considera cumplida al llegar al umbral verde (90 %) del objetivo. «Frecuencia semanal»: la semana cumple si hay al menos N días cumplidos (N baja solo en semanas parciales o con días que no aplican). «Total»: se suma la semana o el mes.'),
    h('li',{},'Rachas: días seguidos cumplidos; un día pasado sin registrar la corta, hoy sin registrar no; descanso y N/A no la cortan.'))));
}
function init(){load();if(S.settings.incArch===undefined)S.settings.incArch=true;render()}
window.HT={get S(){return S},set S(v){S=v},UI,score,evalHabit,aggregate,streak,studyHours,subjHours,sleepHours,classesOn,clashes,taskState,taskPending,render,seed,period,subjActive,setLog,monday,addD,today,ratio,load,save};
if(document.readyState!=='loading')init();else document.addEventListener('DOMContentLoaded',init);
</script>
