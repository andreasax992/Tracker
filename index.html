<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f4f6f8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#10141c" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Mi Tracker">
<meta name="format-detection" content="telephone=no">
<title>Mi Tracker · hábitos, horario y estudio</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<a class="skip" href="#app">Saltar al contenido</a>
<header>
  <div class="top">
    <div class="logo">Mi <b>Tracker</b></div>
    <div class="tools">
      <input id="q" class="q" placeholder="Buscar…" aria-label="Buscar" enterkeyhint="search">
      <button class="btn ic" id="sbtn" aria-label="Buscar" title="Buscar">🔍</button>
      <button class="btn ic" id="undo" title="Deshacer (Ctrl+Z)" aria-label="Deshacer">↶</button>
      <button class="btn ic" id="redo" title="Rehacer (Ctrl+Y)" aria-label="Rehacer">↷</button>
    </div>
  </div>
  <nav id="nav" aria-label="Secciones"></nav>
</header>
<main id="app" tabindex="-1"></main>
<nav id="tabbar" class="tabbar" aria-label="Navegación principal"></nav>
<script src="js/core.js"></script>
<script src="js/i18n.js"></script>
<script src="js/extra.js"></script>
<script src="js/ui.js"></script>
</body>
</html>
